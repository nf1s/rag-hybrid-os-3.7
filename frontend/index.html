<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Assistant</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e8eaed; color: #1f1f1f; height: 100vh; display: flex; flex-direction: column; }
  .app { max-width: 800px; margin: 0 auto; width: 100%; height: 100vh; display: flex; flex-direction: column; background: #f8f9fa; box-shadow: 0 0 20px rgba(0,0,0,.06); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; background: #fff; border-bottom: 1px solid #e0e0e0; }
  header h1 { font-size: 1.05rem; font-weight: 600; color: #1f1f1f; }
  header h1 span { margin-right: 0.4rem; }
  #newChatBtn { padding: 0.35rem 0.85rem; font-size: 0.8rem; background: none; border: 1px solid #dadce0; border-radius: 20px; cursor: pointer; color: #444; transition: background .15s; }
  #newChatBtn:hover { background: #f1f3f4; }
  #chat { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }
  .msg { max-width: 82%; padding: 0.75rem 1rem; border-radius: 18px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #1f1f1f; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .msg.bot p { margin-bottom: 0.5rem; }
  .msg.bot p:last-child { margin-bottom: 0; }
  .sources-toggle { font-size: 0.78rem; color: #1a73e8; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 0.25rem; margin-top: 0.25rem; }
  .sources-toggle:hover { text-decoration: underline; }
  .sources-toggle .arrow { display: inline-block; transition: transform .2s; font-size: 0.65rem; }
  .sources-toggle .arrow.open { transform: rotate(90deg); }
  .sources-list { margin-top: 0.5rem; display: none; flex-direction: column; gap: 0.35rem; }
  .sources-list.open { display: flex; }
  .source-card { background: #f1f3f4; padding: 0.5rem 0.7rem; border-radius: 8px; font-size: 0.82rem; border-left: 3px solid #1a73e8; }
  .source-card .title { font-weight: 600; color: #1f1f1f; }
  .source-card .score { color: #666; font-size: 0.75rem; }
  .source-card .excerpt { color: #444; margin-top: 0.2rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 0.75rem 1rem; background: #fff; border: 1px solid #e0e0e0; border-radius: 18px; border-bottom-left-radius: 4px; align-items: center; }
  .typing span { width: 7px; height: 7px; background: #888; border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  .error-banner { background: #fce8e6; color: #c5221f; padding: 0.5rem 1rem; font-size: 0.85rem; text-align: center; border-bottom: 1px solid #f5c6c2; }
  footer { padding: 0.75rem 1.25rem; background: #fff; border-top: 1px solid #e0e0e0; }
  #inputForm { display: flex; gap: 0.5rem; align-items: center; }
  #input { flex: 1; padding: 0.6rem 1rem; font-size: 0.95rem; border: 1px solid #dadce0; border-radius: 24px; outline: none; transition: border-color .15s; }
  #input:focus { border-color: #1a73e8; }
  #sendBtn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #1a73e8; color: #fff; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0; }
  #sendBtn:hover { background: #1557b0; }
  #sendBtn:disabled { background: #ccc; cursor: not-allowed; }
  .welcome { text-align: center; color: #666; margin: auto; font-size: 0.95rem; line-height: 1.6; padding: 2rem; }
  .welcome h2 { color: #1f1f1f; font-size: 1.3rem; margin-bottom: 0.5rem; }
  @media (max-width: 600px) { .msg { max-width: 92%; } #chat { padding: 0.75rem; } header, footer { padding: 0.6rem 0.75rem; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span>&#x1f916;</span> RAG Assistant</h1>
    <button id="newChatBtn">+ New Chat</button>
  </header>
  <div id="error" class="error-banner" style="display:none"></div>
  <div id="chat">
    <div class="welcome">
      <h2>Ask me anything</h2>
      <p>I search the knowledge base to find relevant information and answer your questions.<br>Try asking about any topic in the articles.</p>
    </div>
  </div>
  <footer>
    <form id="inputForm">
      <input type="text" id="input" placeholder="Ask a question..." autofocus>
      <button type="submit" id="sendBtn">&#x27A4;</button>
    </form>
  </footer>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const form = document.getElementById('inputForm');
  const errorEl = document.getElementById('error');
  const newChatBtn = document.getElementById('newChatBtn');

  let conversationId = null;
  let loading = false;

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function markdownToHtml(text) {
    let html = escHtml(text);
    html = html.replace(/&gt;/g, '>');
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    const lines = html.split('\n');
    let inList = false;
    const result = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const listMatch = line.match(/^(\s*)[-*+]\s+(.*)/);
      if (listMatch) {
        if (!inList) { result.push('<ul>'); inList = true; }
        result.push('<li>' + listMatch[2] + '</li>');
        continue;
      }
      if (inList) { result.push('</ul>'); inList = false; }
      const headerMatch = line.match(/^(#{1,3})\s+(.*)/);
      if (headerMatch) {
        result.push(`<h${headerMatch[1].length}>${headerMatch[2]}</h${headerMatch[1].length}>`);
        continue;
      }
      if (line.trim() === '') {
        result.push('');
        continue;
      }
      result.push('<p>' + line + '</p>');
    }
    if (inList) result.push('</ul>');
    return result.join('\n');
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function hideError() {
    errorEl.style.display = 'none';
  }

  function addMessage(text, role, sources) {
    const welcome = chat.querySelector('.welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = 'msg ' + role;

    if (role === 'bot') {
      const container = document.createElement('div');
      container.innerHTML = markdownToHtml(text);
      div.appendChild(container);

      if (sources && sources.length > 0) {
        const toggle = document.createElement('div');
        toggle.className = 'sources-toggle';
        toggle.innerHTML = `<span class="arrow">&#x25B6;</span> ${sources.length} source${sources.length > 1 ? 's' : ''}`;

        const list = document.createElement('div');
        list.className = 'sources-list';

        sources.forEach(s => {
          const card = document.createElement('div');
          card.className = 'source-card';
          card.innerHTML = `
            <div class="title">${escHtml(s.title)} <span class="score">(score: ${s.score.toFixed(3)})</span></div>
            <div class="excerpt">${escHtml(s.excerpt)}</div>`;
          list.appendChild(card);
        });

        toggle.addEventListener('click', () => {
          list.classList.toggle('open');
          toggle.querySelector('.arrow').classList.toggle('open');
        });

        div.appendChild(toggle);
        div.appendChild(list);
      }
    } else {
      div.textContent = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    for (let i = 0; i < 3; i++) {
      const span = document.createElement('span');
      div.appendChild(span);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setLoading(l) {
    loading = l;
    sendBtn.disabled = l;
    input.disabled = l;
    if (l) input.blur(); else input.focus();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || loading) return;

    hideError();
    addMessage(text, 'user');
    input.value = '';
    showTyping();
    setLoading(true);

    try {
      const res = await fetch('/api/rag/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversation_id: conversationId })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.detail || `Server returned ${res.status}`);
      }

      const data = await res.json();
      conversationId = data.conversation_id;
      hideTyping();
      addMessage(data.reply, 'bot', data.sources);
    } catch (err) {
      hideTyping();
      showError(err.message);
    } finally {
      setLoading(false);
    }
  }

  function newChat() {
    conversationId = null;
    chat.querySelectorAll('.msg, .typing, .welcome').forEach(el => el.remove());
    hideError();
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.innerHTML = '<h2>Ask me anything</h2><p>I search the knowledge base to find relevant information and answer your questions.<br>Try asking about any topic in the articles.</p>';
    chat.appendChild(welcome);
    input.value = '';
    input.focus();
  }

  form.addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
  newChatBtn.addEventListener('click', newChat);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) e.preventDefault(); });
</script>
</body>
</html>
