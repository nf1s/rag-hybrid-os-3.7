<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Search</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
  h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }

  .mode-selector { display: flex; gap: 1rem; margin-bottom: 1rem; }
  .mode-selector label { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; font-size: 0.9rem; color: #555; }
  .mode-selector label.active { color: #333; font-weight: 600; }
  .mode-selector input[type="radio"] { accent-color: #4a90d9; }

  .search-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .search-row input { flex: 1; padding: 0.65rem 1rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; outline: none; }
  .search-row input:focus { border-color: #4a90d9; }
  .search-row button { padding: 0.65rem 1.5rem; font-size: 1rem; background: #4a90d9; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .search-row button:hover { background: #357abd; }
  .error { color: #d32f2f; margin-bottom: 1rem; }
  .hit { background: #fff; padding: 1rem 1.25rem; border-radius: 6px; margin-bottom: 0.75rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hit h3 { margin-bottom: 0.35rem; font-size: 1.05rem; }
  .hit .id { font-size: 0.8rem; color: #888; margin-bottom: 0.5rem; }
  .hit p { line-height: 1.5; color: #555; }
  .hit em { background: #fff3b0; font-style: normal; }
  .hit .mode-tag { display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 3px; color: #fff; margin-left: 0.5rem; }
  .mode-tag.ft { background: #4a90d9; }
  .mode-tag.neural { background: #7b1fa2; }
  .mode-tag.hybrid { background: #e65100; }
  .meta { text-align: center; color: #888; margin-top: 2rem; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Article Search</h1>

  <div class="mode-selector">
    <label id="lbl-ft" class="active">
      <input type="radio" name="mode" value="ft" checked> Full Text
    </label>
    <label id="lbl-neural">
      <input type="radio" name="mode" value="neural"> Semantic
    </label>
    <label id="lbl-hybrid">
      <input type="radio" name="mode" value="hybrid"> Hybrid
    </label>
  </div>

  <div class="search-row">
    <input type="text" id="q" placeholder="Search articles..." autofocus>
    <button id="searchBtn">Search</button>
  </div>
  <div id="error" class="error"></div>
  <div id="results"></div>
  <div class="meta" id="meta"></div>
</div>
<script>
  const q = document.getElementById('q');
  const searchBtn = document.getElementById('searchBtn');
  const resultsEl = document.getElementById('results');
  const errorEl = document.getElementById('error');
  const metaEl = document.getElementById('meta');
  const radios = document.querySelectorAll('input[name="mode"]');

  let currentMode = 'ft';

  radios.forEach(r => {
    r.addEventListener('change', () => {
      currentMode = r.value;
      document.querySelectorAll('.mode-selector label').forEach(l => l.classList.remove('active'));
      document.getElementById('lbl-' + r.value).classList.add('active');
    });
  });

  function modeTag(mode) {
    const labels = { ft: 'FT', neural: 'Semantic', hybrid: 'Hybrid' };
    const cls = { ft: 'ft', neural: 'neural', hybrid: 'hybrid' };
    return `<span class="mode-tag ${cls[mode]}">${labels[mode]}</span>`;
  }

  function buildQuery(query) {
    switch (currentMode) {
      case 'ft':
        return {
          query: { multi_match: { query, fields: ['title', 'body'] } },
          highlight: { fields: { title: {}, body: {} } }
        };
      case 'neural':
        return {
          _source: { exclude: ['body_semantic_info'] },
          query: { neural: { body: { query_text: query } } },
          highlight: { fields: { title: {}, body: {} } }
        };
      case 'hybrid':
        return {
          _source: { exclude: ['body_semantic_info'] },
          query: {
            hybrid: {
              queries: [
                { neural: { body: { query_text: query } } },
                { multi_match: { query, fields: ['title^2', 'body'] } }
              ]
            }
          },
          highlight: { fields: { title: {}, body: {} } }
        };
    }
  }

  async function search() {
    const query = q.value.trim();
    if (!query) return;
    errorEl.textContent = '';
    resultsEl.innerHTML = '<p>Searching...</p>';
    metaEl.textContent = '';

    try {
      const body = buildQuery(query);
      const url = currentMode === 'hybrid'
        ? '/api/os/article/_search?search_pipeline=hybrid-search-pipeline'
        : '/api/os/article/_search';
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`OpenSearch returned ${res.status}`);
      const data = await res.json();
      const hits = data.hits?.hits ?? [];
      const total = data.hits?.total?.value ?? 0;

      metaEl.textContent = `${total} result${total !== 1 ? 's' : ''}`;

      if (!hits.length) {
        resultsEl.innerHTML = '<p>No results found.</p>';
        return;
      }

      resultsEl.innerHTML = hits.map(h => {
        const src = h._source;
        const hl = h.highlight || {};
        const title = hl.title?.[0] || src.title;
        const body = hl.body?.[0] || src.body;
        return `<div class="hit"><h3>${title} ${modeTag(currentMode)}</h3><div class="id">${src.id}</div><p>${body}</p></div>`;
      }).join('');
    } catch (err) {
      errorEl.textContent = err.message;
      resultsEl.innerHTML = '';
    }
  }

  searchBtn.addEventListener('click', search);
  q.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
</script>
</body>
</html>
