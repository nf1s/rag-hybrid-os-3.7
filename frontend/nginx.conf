server {
    listen 80;

    resolver kube-dns.kube-system.svc.cluster.local valid=5s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/os/ {
        rewrite ^/api/os/(.*) /$1 break;
        set $os_endpoint "http://hybrid-search-single:9200";
        proxy_pass $os_endpoint;
        proxy_set_header Host $host;
    }

    location /api/rag/ {
        set $rag_endpoint "http://rag-api.opensearch.svc.cluster.local:8000";
        proxy_pass $rag_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
