apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: hybrid-search
build:
  artifacts:
    - image: hybrid-search-ui
      context: frontend
      docker:
        dockerfile: Dockerfile
    - image: hybrid-search-seed
      context: seed-job
      docker:
        dockerfile: Dockerfile
    - image: hybrid-search-template
      context: template-job
      docker:
        dockerfile: Dockerfile
    - image: hybrid-search-model
      context: model-job
      docker:
        dockerfile: Dockerfile
  local:
    push: false
deploy:
  helm:
    releases:
      - name: opensearch
        namespace: opensearch
        createNamespace: true
        chartPath: charts/hybrid-search
        valuesFiles:
          - charts/hybrid-search/values.yaml
      - name: ui
        namespace: opensearch
        createNamespace: true
        chartPath: charts/ui
      - name: template-job
        namespace: opensearch
        createNamespace: true
        chartPath: charts/template-job
      - name: model-job
        namespace: opensearch
        createNamespace: true
        chartPath: charts/model-job
      - name: seed-job
        namespace: opensearch
        createNamespace: true
        chartPath: charts/seed-job
